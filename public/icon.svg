<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#F3E7C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="74" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.45"/>

  <!-- Heritage Monogram Badge -->
  <g filter="url(#shadow)">
    <!-- Shield / Crest Contour -->
    <path d="M256,92 C328,92 376,128 376,192 C376,280 256,380 256,380 C256,380 136,280 136,192 C136,128 184,92 256,92 Z" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4"/>
    
    <!-- Central NCH Monogram -->
    <text x="256" y="245" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="4">NCH</text>
    
    <!-- Subtitle Banner -->
    <text x="256" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="6">EST. 1970</text>
    
    <!-- Location Line -->
    <text x="256" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="3">RAWALPINDI</text>

    <!-- Decorative Diamond Separator -->
    <polygon points="256,326 261,332 256,338 251,332" fill="url(#gold)"/>
    <line x1="190" y1="332" x2="242" y2="332" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
    <line x1="270" y1="332" x2="322" y2="332" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="440" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="3">NIAZ CLOTH HOUSE</text>
</svg>
